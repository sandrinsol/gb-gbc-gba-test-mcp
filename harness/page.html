<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game Boy Harness</title>
  <style>
    html, body { margin: 0; background: #000; }
    /* Fixed size so screenshots are deterministic. Emu native is 240x160 (3:2). */
    #game { width: 720px; height: 480px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
  // Headless control bridge over the bundled EmulatorJS mgba core.
  // Everything the Node driver calls goes through window.Emu.
  (function () {
    const params = new URLSearchParams(location.search);
    const rom = params.get('rom'); // absolute path served by the harness static server

    // Pick the EmulatorJS system by ROM extension:
    //   .gba -> 'gba' (mgba core), .gb/.gbc -> 'gb' (gambatte core).
    const ext = (rom || '').split('?')[0].split('.').pop().toLowerCase();
    const system = ext === 'gb' || ext === 'gbc' ? 'gb' : 'gba';

    // --- EmulatorJS config (headless + deterministic) ---
    window.EJS_player = '#game';
    window.EJS_core = system;
    window.EJS_gameName = 'harness';
    window.EJS_gameUrl = rom;
    window.EJS_pathtodata = '../data/';
    window.EJS_startOnLoaded = true;
    window.EJS_volume = 0;            // mute; audio is irrelevant to tests
    window.EJS_language = 'en-US';
    window.EJS_disableAutoLang = false;
    window.EJS_threads = false;       // single-thread: deterministic, no COOP/COEP needed
    window.EJS_disableDatabases = true;

    // --- Bridge ---
    const Emu = (window.Emu = {});
    Emu.system = system; // 'gba' or 'gb'
    Emu._startPromise = new Promise((res) => (Emu._resolveStart = res));
    Emu.started = false;
    window.EJS_onGameStart = () => { Emu.started = true; Emu._resolveStart(); };

    // RetroArch joypad button ids used by simulateInput(player, id, value).
    const BUTTONS = { B:0, SELECT:2, START:3, UP:4, DOWN:5, LEFT:6, RIGHT:7, A:8, L:10, R:11 };
    Emu.BUTTONS = Object.keys(BUTTONS);

    const gm = () => window.EJS_emulator.gameManager;

    Emu.ready = () => Emu._startPromise;
    // Logical frame clock = the core's counter minus an offset. The offset only moves
    // when fast-forward overshoot recovery rewinds the machine (the counter itself
    // never rewinds), so frameNum() always names the emulated frame you're on.
    Emu._offset = 0;
    Emu.frameNum = () => gm().getFrameNum() - Emu._offset; // absolute, boot-referenced
    Emu.videoDimensions = () => ({ w: gm().getVideoDimensions('width'), h: gm().getVideoDimensions('height') });

    const pressed = new Set();
    Emu.setButton = (name, down) => {
      const key = String(name).toUpperCase();
      const id = BUTTONS[key];
      if (id === undefined) throw new Error('Unknown button: ' + name);
      gm().simulateInput(0, id, down ? 32767 : 0);
      if (down) pressed.add(key); else pressed.delete(key);
    };
    Emu.setButtons = (names, down) => { for (const n of names) Emu.setButton(n, down); };
    Emu.heldButtons = () => [...pressed];

    // ---- Fast-forward (deterministic) ----
    // The core can't be single-stepped, so long waits run in fast-forward and drop
    // back to 1x FF_MARGIN frames before the target; at 1x the core advances at most
    // one frame per animation frame, so we land exactly on the target. If a stall
    // ever makes fast-forward jump past the target anyway, we restore an in-page
    // snapshot taken at the start of the wait and redo it at 1x — so results are
    // bit-identical to a pure 1x run either way. Disable with ?fast=0.
    Emu.fast = params.get('fast') !== '0';
    const FF_RATIO = 8, FF_MARGIN = 60;
    Emu.stats = { ffWaits: 0, recoveries: 0, restoreRetries: 0 };
    Emu._forceOvershoot = false; // test hook: pretend the next fast-forward overshot
    let ffOn = false;
    const setFF = (on) => {
      if (on === ffOn) return;
      ffOn = on;
      if (on) gm().setFastForwardRatio(FF_RATIO);
      gm().toggleFastForward(on ? 1 : 0);
    };

    // The core is PAUSED between calls and only runs inside a wait, so every
    // screenshot / RAM read / write lands on exactly the frame the clock says —
    // not wherever wall-clock time has drifted to since the last call.
    Emu._running = true;
    Emu.pause = () => { if (Emu._running) { gm().toggleMainLoop(0); Emu._running = false; } };
    Emu.resume = () => { if (!Emu._running) { gm().toggleMainLoop(1); Emu._running = true; } };

    const raf = () => new Promise((r) => requestAnimationFrame(r));

    // Swap the machine state while keeping the logical clock on `frame`. A load is
    // queued and applied by a later main-loop iteration; depending on frame pacing
    // that iteration may or may not also run a core frame, so after it we compare
    // the machine to the requested state and retry until it matches exactly.
    // (A handful of header bytes — a host timestamp — always differ, hence NOISE.)
    const NOISE = 16;
    const sameState = (a, b) => {
      if (a.length !== b.length) return false;
      let n = 0;
      for (let i = 0; i < a.length; i++) if (a[i] !== b[i] && ++n > NOISE) return false;
      return true;
    };
    const restore = async (u8, frame) => {
      setFF(false);
      for (let attempt = 0; attempt < 10; attempt++) {
        gm().loadState(u8);
        const c = gm().getFrameNum();
        Emu.resume();
        while (gm().getFrameNum() <= c) await raf();
        Emu.pause();
        if (sameState(gm().getState(), u8)) { Emu._offset = gm().getFrameNum() - frame; return; }
        Emu.stats.restoreRetries++;
      }
      throw new Error('could not restore the save state exactly');
    };

    // Run until the clock reaches an absolute target, then pause. A wall-clock
    // timeout (scaled to the distance, so long 1x waits don't trip it) guards
    // against a stalled main loop.
    async function waitUntil(targetFrame) {
      if (Emu.frameNum() >= targetFrame) { Emu.pause(); return Emu.frameNum(); }
      const timeoutMs = 30000 + (targetFrame - Emu.frameNum()) * (1000 / 60) * 2;
      const t0 = performance.now();
      let snap = null, snapFrame = 0;
      if (Emu.fast && targetFrame - Emu.frameNum() > FF_MARGIN * 2) {
        snapFrame = Emu.frameNum();
        snap = gm().getState();
        Emu.stats.ffWaits++;
      }
      Emu.resume();
      if (snap) setFF(true);
      for (;;) {
        let f = Emu.frameNum();
        if (snap && (f > targetFrame || (Emu._forceOvershoot && ffOn && f > snapFrame))) {
          // Overshot: rewind to the snapshot and finish this wait at 1x.
          Emu._forceOvershoot = false;
          Emu.stats.recoveries++;
          await restore(snap, snapFrame);
          snap = null;
          Emu.resume();
          f = Emu.frameNum();
        }
        if (ffOn && targetFrame - f <= FF_MARGIN) setFF(false);
        if (f >= targetFrame && !ffOn) { Emu.pause(); return f; }
        if (performance.now() - t0 > timeoutMs) {
          setFF(false);
          Emu.pause();
          throw new Error(`waitFrames timeout: frame ${f} < target ${targetFrame}`);
        }
        await raf();
      }
    }

    // Deterministic clock: targets accumulate on ONE absolute timeline anchored at
    // boot (frame 0), so identical scripts stop on identical emulated frames across
    // runs regardless of boot jitter. (Verified bit-identical.)
    Emu._target = 0;
    Emu.waitFrames = (n) => { Emu._target += n; return waitUntil(Emu._target); };
    Emu.waitUntilFrame = (abs) => { if (abs > Emu._target) Emu._target = abs; return waitUntil(abs); };

    // Press button(s), hold for holdFrames, release, then settle for releaseFrames.
    // `name` may be one button or an array pressed together (e.g. ['A','B']).
    Emu.tap = async (name, holdFrames = 4, releaseFrames = 4) => {
      const names = Array.isArray(name) ? name : [name];
      Emu.setButtons(names, true);
      await Emu.waitFrames(holdFrames);
      Emu.setButtons(names, false);
      await Emu.waitFrames(releaseFrames);
    };

    const u8ToB64 = (bytes) => {
      const u8 = new Uint8Array(bytes);
      let bin = '';
      const CHUNK = 0x8000;
      for (let i = 0; i < u8.length; i += CHUNK) bin += String.fromCharCode.apply(null, u8.subarray(i, i + CHUNK));
      return btoa(bin);
    };
    const b64ToU8 = (b64) => {
      const bin = atob(b64);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return u8;
    };

    // The core only renders a screenshot from inside its main loop, so while paused
    // we run it just long enough to capture, then restore the exact pre-capture state.
    Emu.screenshot = async () => {
      if (Emu._running) return u8ToB64(await gm().screenshot());
      const snap = gm().getState(), f = Emu.frameNum();
      Emu.resume();
      try { return u8ToB64(await gm().screenshot()); } // PNG -> base64
      finally { Emu.pause(); await restore(snap, f); }
    };
    Emu.saveState = async () => u8ToB64(await gm().getState());     // savestate -> base64
    // The logical clock keeps counting from where it is (a state doesn't carry the
    // frontend's frame counter); re-anchor the deterministic target so later
    // waitFrames() calls stay correct.
    Emu.loadState = async (b64) => {
      Emu.pause();
      await restore(b64ToU8(b64), Emu.frameNum());
      Emu._target = Emu.frameNum();
    };
    Emu.restart = () => gm().restart();

    // Live system RAM, IF the loaded core exports the libretro memory API.
    // The bundled mgba core does NOT (returns null); a core rebuilt with
    // _retro_get_memory_data/_size exported lights this up automatically.
    Emu.readSystemRam = () => {
      const M = gm().Module;
      if (typeof M._retro_get_memory_data !== 'function' || typeof M._retro_get_memory_size !== 'function') return null;
      const size = M._retro_get_memory_size(2 /* RETRO_MEMORY_SYSTEM_RAM */);
      const ptr = M._retro_get_memory_data(2);
      if (!size || !ptr) return null;
      return { base64: u8ToB64(M.HEAPU8.subarray(ptr, ptr + size)), size };
    };
    Emu.hasMemoryAccess = () => Emu.readSystemRam() !== null;

    // Boot the emulator.
    const s = document.createElement('script');
    s.src = '../data/loader.js';
    document.body.appendChild(s);
  })();
  </script>
</body>
</html>
