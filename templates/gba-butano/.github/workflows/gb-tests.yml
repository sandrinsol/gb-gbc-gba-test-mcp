# Builds the ROM in devkitPro's image and runs every tests/gb/*.json script
# against it in the gb-gbc-gba-test emulator. Failures upload screenshots and diffs.
name: gb-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Butano
        run: git clone --depth 1 --branch 21.9.0 https://github.com/GValiente/butano "$RUNNER_TEMP/butano"

      - name: Build
        run: make -j4 BUTANO="$RUNNER_TEMP/butano"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the test harness
        run: |
          git clone --depth 1 https://github.com/sandrinsol/gb-gbc-gba-test-mcp "$RUNNER_TEMP/gbtest"
          cd "$RUNNER_TEMP/gbtest/harness"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Run the tests
        run: |
          status=0
          for script in tests/gb/*.json; do
            echo "::group::$script"
            node "$RUNNER_TEMP/gbtest/harness/runner.mjs" "$script" "out/$(basename "$script" .json)" || status=1
            echo "::endgroup::"
          done
          exit $status

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gb-test-results
          path: |
            out/
            tests/gb/goldens/*.diff.png
