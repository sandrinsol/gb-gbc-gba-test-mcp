<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Boy Emulator</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #16161e;
      color: #e6e6ee;
      font-family: system-ui, -apple-system, sans-serif;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .5px; }
    #picker {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 40px;
    }
    label.btn {
      background: #5a4fff;
      color: #fff;
      padding: 12px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: background .15s;
    }
    label.btn:hover { background: #6d63ff; }
    small { color: #8a8a9a; }
    #box {
      width: 100%;
      max-width: 720px;
      aspect-ratio: 3 / 2;
    }
    #game { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <h1>🎮 Game Boy Emulator</h1>

  <div id="picker">
    <label class="btn">
      Load ROM
      <input id="rom" type="file" accept=".gba,.gb,.gbc,.zip" hidden />
    </label>
    <small>Pick a <code>.gba</code>, <code>.gb</code> or <code>.gbc</code> file from your computer to start playing. Runs 100% offline.</small>
  </div>

  <div id="box" hidden>
    <div id="game"></div>
  </div>

  <script>
    document.getElementById('rom').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('picker').hidden = true;
      document.getElementById('box').hidden = false;

      // EmulatorJS configuration — it does all the actual emulation.
      // Everything is served from the local data/ folder: fully offline.
      window.EJS_player = '#game';
      // Pick the core by ROM extension: .gb/.gbc -> Game Boy (gambatte), else GBA (mgba).
      const ext = file.name.split('.').pop().toLowerCase();
      window.EJS_core = (ext === 'gb' || ext === 'gbc') ? 'gb' : 'gba';
      window.EJS_gameName = file.name.replace(/\.[^.]+$/, '');
      window.EJS_gameUrl = URL.createObjectURL(file);
      window.EJS_pathtodata = 'data/';
      window.EJS_startOnLoaded = true;
      // Use the built-in English UI so no localization file is fetched.
      window.EJS_language = 'en-US';
      window.EJS_disableAutoLang = false;

      const s = document.createElement('script');
      s.src = 'data/loader.js';
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
