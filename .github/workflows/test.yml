name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: harness/package-lock.json

      # Skip the postinstall playwright download here; we install the browser
      # WITH its system deps in the next step (needed on CI runners).
      - run: npm ci --ignore-scripts

      - run: npx playwright install --with-deps chromium

      # Boots the mgba + gambatte cores headlessly (software WebGL via SwiftShader)
      # and runs the full suite: smoke, determinism/input, fast-forward, RAM
      # read/write/search, GB/GBC, and the MCP server end to end.
      - run: npm test
